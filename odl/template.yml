AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: ODL PDF Parser Lambda

Globals:
  Function:
    Timeout: 600
    MemorySize: 4096
    EphemeralStorage:
      Size: 4096

Resources:
  ODLBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: docker-containers-070905

  # ── ODL Batch Queue (Phase 4 SQS-native batch trigger stub) ─────────────────
  # Documents that fail the quality gate are enqueued here.
  # BatchSize=10, MaximumBatchingWindowInSeconds=60 will be wired in Phase 4
  # when the full prod event-source mapping is added.
  OdlBatchQueueDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: OdlBatchQueue-DLQ
      MessageRetentionPeriod: 1209600  # 14 days

  OdlBatchQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: OdlBatchQueue
      VisibilityTimeout: 660          # must be > Lambda Timeout (600s)
      MessageRetentionPeriod: 3600    # 1 hour — stale batches should not linger
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt OdlBatchQueueDLQ.Arn
        maxReceiveCount: 3            # 2 retries before DLQ (3 total attempts)

  ODLParserFunction:
    Type: AWS::Serverless::Function

    Properties:
      PackageType: Image

      FunctionName: odl-parser-lambda

      Architectures:
        - x86_64

      Policies:
        - AWSLambdaBasicExecutionRole

        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource:
                - arn:aws:s3:::*/*

        # Allow the function to receive / delete messages from OdlBatchQueue
        # (Phase 4 will add the event source mapping that auto-polls the queue)
        - Statement:
            - Effect: Allow
              Action:
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
                - sqs:SendMessage
              Resource:
                - !GetAtt OdlBatchQueue.Arn
                - !GetAtt OdlBatchQueueDLQ.Arn

    Metadata:
      DockerContext: .
      Dockerfile: Dockerfile
      DockerTag: latest

Outputs:

  ODLFunctionArn:
    Value: !GetAtt ODLParserFunction.Arn

  OdlBatchQueueUrl:
    Description: "URL of the ODL batch queue (used by Lambda A to enqueue quality-failed docs)"
    Value: !Ref OdlBatchQueue

  OdlBatchQueueArn:
    Description: "ARN of the ODL batch queue"
    Value: !GetAtt OdlBatchQueue.Arn
