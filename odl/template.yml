AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: ODL PDF Parser Lambda

Globals:
  Function:
    Timeout: 300
    MemorySize: 2048

Resources:
  ODLBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: docker-containers-070905

  ODLParserFunction:
    Type: AWS::Serverless::Function

    Properties:
      PackageType: Image

      FunctionName: odl-parser-lambda

      Architectures:
        - x86_64

      Policies:
        - AWSLambdaBasicExecutionRole

        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource:
                - arn:aws:s3:::*/*

    Metadata:
      DockerContext: .
      Dockerfile: Dockerfile
      DockerTag: latest

Outputs:

  ODLFunctionArn:
    Value: !GetAtt ODLParserFunction.Arn